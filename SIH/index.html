<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishi Mitra — कृषि मित्र</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<!-- ============ SCREEN 1: LOGIN ============ -->
<div class="screen active no-nav" id="screen-login">
  <div class="login-container">
    <div class="login-logo">
      <span class="logo-icon">🌾</span>
      <div class="logo-text">Krishi Mitra</div>
      <div class="logo-subtext" data-i18n="login_subtitle">कृषि मित्र — Your Farming Companion</div>
    </div>

    <div class="login-illustration">🧑‍🌾</div>

    <p class="login-tagline" data-i18n="login_tagline">Smart farming decisions for better income</p>

    <!-- Language Selector -->
    <div class="lang-selector">
      <button class="lang-btn selected" onclick="setLanguage('hi')" id="lang-hi">🇮🇳 हिंदी</button>
      <button class="lang-btn" onclick="setLanguage('en')" id="lang-en">🇬🇧 English</button>
    </div>

    <!-- Google Sign In -->
    <div class="login-form" id="login-google-step">
      <button class="btn-google" id="google-signin-btn" onclick="initiateGoogleLogin()" aria-label="Sign in with Google">
        <svg class="google-icon" viewBox="0 0 24 24" width="22" height="22">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span class="btn-google-text" data-i18n="signin_google">Google से साइन इन करें</span>
      </button>
      <div id="g_id_signin_hidden" style="display:none;"></div>
    </div>

    <div class="login-footer" data-i18n="login_footer">
      By continuing, you agree to our Terms & Conditions
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/main.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/auth.js"></script>
</body>
</html>
